<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="把每一天，变成自己的积累。任务、学习、训练与财务的个人记录空间。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Daymark · 每一天，都算数</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 5.4v5.4c0 4.9 2.9 8.3 7 10.2 4.1-1.9 7-5.3 7-10.2V5.4Z"/><path d="M8.3 8.4c.9.8 2.1.8 3 0M12.7 8.4c.9.8 2.1.8 3 0"/><path d="M8.5 12.2h7M8.5 14.6h7"/></svg></span><span>daymark<span class="brand-caption">YOUR PERSONAL SPACE</span></span></a>
      <p class="nav-caption">每一天，都算数</p>
      <nav id="mainNav" class="main-nav"></nav>
      <div class="sidebar-bottom">
        <div class="local-card"><span class="local-icon" aria-hidden="true">↗</span><div><strong>留下记录，看见成长。</strong><p>你的下一步，由你定义。</p></div></div>
        <button class="profile-button" data-action="settings"><span class="avatar">D</span><span><strong>我的个人空间</strong><small>从日常，走向更远</small></span><span aria-hidden="true">⌘</span></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span class="mobile-brand">daymark<span>·</span></span><span class="desktop-label">个人空间</span><span class="breadcrumb-divider">/</span><span id="pageCrumb">总览</span></div>
        <div class="topbar-actions"><span id="syncStatus" class="sync-status" role="status"><i></i><span>正在连接</span></span><button class="icon-button" data-action="theme" aria-label="切换深色模式" title="切换主题" id="themeButton"></button><button class="icon-button" data-action="network" aria-label="连接手机" title="连接手机" id="networkButton"></button><button class="button button-dark button-small" data-action="new-task" aria-label="新建任务"><span aria-hidden="true">＋</span><span>新建任务</span></button></div>
      </header>
      <main id="main" tabindex="-1"><div class="initial-loading"><span class="loading-orbit"></span><p>正在打开你的个人空间…</p></div></main>
      <footer class="site-footer"><span>daymark · 慢慢来，每一步都算数。</span><span>记录属于你，数据也属于你。</span></footer>
    </div>
  </div>
  <nav id="mobileNav" class="mobile-nav" aria-label="移动端导航"></nav>
  <dialog id="appDialog" class="app-dialog" aria-labelledby="dialogTitle"><div id="dialogContent"></div></dialog>
  <div id="toastRegion" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">请启用 JavaScript，以使用任务记录和数据导出功能。</p></noscript>
</body>
</html>
